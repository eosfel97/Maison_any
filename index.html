<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Mon site any gnahiet</title>
    <style>
        /* Réinitialisation des marges et padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Style global */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FF7E5F, #FEB47B);
            color: white;
            text-align: center;
            overflow: hidden;
            height: 100vh;
        }

        /* Animations de fond */
        @keyframes backgroundAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: linear-gradient(135deg, #FF7E5F, #FEB47B);
            background-size: 400% 400%;
            animation: backgroundAnimation 15s ease infinite;
        }

        /* Effet de texte d'en-tête */
        header {
            margin-top: 100px;
            animation: slideIn 2s ease-out;
        }

        header h1 {
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 4px 6px rgba(0,0,0,0.5);
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        /* Animation d'apparition du texte */
        @keyframes textGlow {
            0% { text-shadow: 0 4px 6px rgba(0,0,0,0.5), 0 0 25px #ff7e5f, 0 0 50px #feb47b; }
            100% { text-shadow: 0 4px 6px rgba(0,0,0,0.5), 0 0 25px #FEB47B, 0 0 100px #FF7E5F; }
        }

        @keyframes slideIn {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(0); }
        }

        /* Animation de texte dans le contenu */
        main {
            padding: 50px;
            background: rgba(0, 0, 0, 0.5);
            margin-top: 40px;
            animation: slideUp 2s ease-out;
            transition: all 0.5s ease-in-out;
        }

        @keyframes slideUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }

        /* Style du titre dans le main */
        main h2 {
            margin: 20px 0;
            font-size: 3rem;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 5px;
            transition: transform 0.4s ease-in-out;
        }

        main h2:hover {
            transform: scale(1.1) rotate(5deg);
            color: #FF7E5F;
        }

        /* Effet de texte interactif */
        main p {
            font-size: 1.2rem;
            color: #fff;
            margin-top: 20px;
            opacity: 0;
            animation: fadeIn 2s forwards 1s;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Bouton avec effet de survol */
        .btn {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 1.5rem;
            background-color: #FF7E5F;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn:hover {
            background-color: #FEB47B;
            transform: scale(1.1);
        }

        .btn:focus {
            outline: none;
        }

        /* Icônes sociales animées */
        .social-icons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icons i {
            font-size: 2rem;
            color: white;
            transition: transform 0.3s ease, color 0.3s ease;
            cursor: pointer;
        }

        .social-icons i:hover {
            transform: scale(1.2);
            color: #FEB47B;
        }

        /* Footer avec animation */
        footer {
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 20px;
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            animation: fadeInFooter 3s ease-in-out forwards;
        }

        @keyframes fadeInFooter {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        footer a {
            color: #FEB47B;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #FF7E5F;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenue sur Mon site any gnahiet</h1>
    </header>

    <main>
        <h2>Un site spectaculaire et interactif!</h2>
        <p>Des animations époustouflantes, des effets visuels et une expérience inoubliable vous attendent sur cette page. Découvrez toutes les possibilités!</p>
        <button class='btn' onclick='alert(\"Merci d'avoir visité!\")'>Cliquez-moi</button>
    </main>

    <div class='social-icons'>
        <i class='fab fa-facebook'></i>
        <i class='fab fa-twitter'></i>
        <i class='fab fa-instagram'></i>
    </div>

    <footer>
        <p>&copy; 2025 Mon site any gnahiet. <a href='https://example.com'>Visitez notre site</a></p>
    </footer>

    <script src='https://kit.fontawesome.com/a076d05399.js'></script>
</body>
</html>
